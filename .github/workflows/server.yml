name: Server Run
on:
    workflow_run:
        workflows: ["Setup Server"]
        inputs:
            should_add_op:
                type: boolean
                default: false
                description: Whether to apply the value of op_name input.
                required: true
            op_name:
                type: string
                required: false
                description: The Minecraft username of a player to make an operator.
                default: "devnull03"
        types:
            - completed

    workflow_dispatch:
        inputs:
            should_add_op:
                type: boolean
                default: false
                description: Whether to apply the value of op_name input.
                required: true
            op_name:
                type: string
                required: false
                description: The Minecraft username of a player to make an operator.
                default: "devnull03"
concurrency:
    group: server-run
    cancel-in-progress: false
permissions:
    contents: write
jobs:
    run:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              name: clone repo locally
            - name: import Node
              uses: actions/setup-node@v3
              with:
                  node-version: 16
            - name: setup jdk 21
              uses: actions/setup-java@v3
              with:
                  java-version: 21
                  distribution: "microsoft"
            # - name: Install remote.it
            #   run: R3_REGISTRATION_CODE="${{ secrets.REMOTEIT_CODE }}" sh -c "$(curl -L https://downloads.remote.it/remoteit/install_agent.sh)"
            - name: Install Cloudflare Tunnel
              run: |
                  sudo mkdir -p --mode=0755 /usr/share/keyrings
                  sudo curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | sudo tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null
                  echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | sudo tee /etc/apt/sources.list.d/cloudflared.list
                  sudo apt-get update && sudo apt-get install cloudflared
            - name: Run Cloudflare Tunnel
              run: cloudflared tunnel run --token ${{ secrets.CLOUDFLARE_TOKEN }}
            - name: Run Server (Long)
              id: run_server
              run: ${{inputs.should_add_op && 'printf "op ' || ''}}${{inputs.should_add_op && inputs.op_name || ''}}${{inputs.should_add_op && '" | ' || ''}}java -Xmx6G -jar fabric-server-mc.1.21.10-loader.0.18.1-launcher.1.1.0.jar nogui
              # Maximum workflow duration is 360 minutes.
              # Setting this prevents progress from being lost by forgetting to stop the server.
              timeout-minutes: 320
              continue-on-error: true
            - name: Save to GitHub
              run: |
                  git pull
                  git config user.name github-actions
                  git config user.email actions@github.com
                  git add .
                  git commit -m "$(cat commit-message.txt)"
                  git push
